name = "laorden-votos"
main = "src/index.js"
compatibility_date = "2026-09-21"

# Sin subdominio *.workers.dev: el único acceso público al API son las rutas
# de www.laorden.org. Evita una segunda URL que sirviera los assets estáticos.
workers_dev = false

# Producción: el sitio lo sirve GitHub Pages; el Worker solo coge estas rutas.
# Sin ellas `wrangler deploy` va bien y la API da 404 en vivo.
routes = [
  { pattern = "www.laorden.org/api/*",   zone_name = "laorden.org" },
  { pattern = "www.laorden.org/admin/*", zone_name = "laorden.org" }
]

[[d1_databases]]
binding = "DB"
database_name = "laorden-votos"
database_id = "ba86c000-fbaa-43d4-b28b-76e78e9d6f9d"
migrations_dir = "migrations"

# Cloudflare Email Service. El binding va por entorno igual que la base: las
# vars y los bindings NO se heredan entre entornos en wrangler.
[[send_email]]
name = "EMAIL"

[vars]
VOTING_OPEN  = "2026-10-11T10:00:00+02:00"
VOTING_CLOSE = "2026-10-17T12:00:00+02:00"
MINI_COUNT   = "37"
# Vacío en producción (mismo origen). Solo para desarrollo local.
CORS_ORIGIN  = ""
# Aplicación de Access de www.laorden.org/admin (distinta de las de test).
ACCESS_TEAM_DOMAIN = "fullmantis.cloudflareaccess.com"
ACCESS_AUD         = "c54b36ae3726ae8640a542a5eba2762607a94ba30a60df47ec82908547cc5e45"

# ── Voto verificado por correo (spec 2026-09-22 §12) ─────────────────────────
CODIGO_MINUTOS   = "10"     # vida del código
CODIGO_INTENTOS  = "5"      # fallos antes de que el código muera
CODIGOS_POR_HORA = "3"      # por dirección — el freno antimailbomb
MAX_CORREOS_DIA  = "400"    # techo global: lo que impide que un fallo queme la
                            # cuota del mes y la reputación del dominio días
                            # antes de que abra la votación
EMAIL_REMITENTE  = "votacion@laorden.org"

# ── Entorno de pruebas: test.laorden.org ─────────────────────────────────────
#
#   ./scripts/desplegar-test.sh
#
# `wrangler deploy --env test` publica un Worker APARTE, llamado
# laorden-votos-test, con su propia base y sus propios secretos. Producción no
# se entera: son dos Workers distintos. Nunca despliegues este entorno sin
# --env, o sobreescribirías el de producción.
#
# Diferencia de fondo con producción: aquí el Worker sirve TAMBIÉN el sitio
# estático (el bloque assets), cosa que en www hace GitHub Pages. Por eso
# test.laorden.org es un custom_domain —el Worker es el origen y Cloudflare
# crea el registro DNS solo— y no una ruta como las de www.
#
# Ojo con wrangler: las vars y los bindings NO se heredan del bloque de
# arriba. Todo lo que necesite este entorno tiene que estar repetido aquí, o
# el despliegue falla la validación.
[env.test]
routes = [{ pattern = "test.laorden.org", custom_domain = true }]

# Qué NO se sube está en .assetsignore, en la raíz del repo: worker/, docs/
# (lleva vuestros correos) y fotos-originales/ (lleva EXIF). El despliegue lee
# el DISCO, no lo que hay en git, así que eso es lo único que separa esos
# ficheros de una URL pública. desplegar-test.sh lo comprueba después de subir.
[env.test.assets]
directory = ".."
binding = "ASSETS"

[[env.test.d1_databases]]
binding = "DB"
database_name = "laorden-votos-test"
database_id = "212093d1-1583-49f4-8dac-2dfbf5784dfa"
migrations_dir = "migrations"

[[env.test.send_email]]
name = "EMAIL"

[env.test.vars]
# Votación FORZADA ABIERTA: es el motivo de que este entorno exista. En
# producción la ventana de verdad la impone el bloque [vars] de arriba.
VOTING_OPEN  = "2026-01-01T00:00:00+01:00"
VOTING_CLOSE = "2027-01-01T00:00:00+01:00"
MINI_COUNT   = "37"
# Mismo origen que la página, igual que en producción: sin CORS.
CORS_ORIGIN  = ""
# El AUD es el de la aplicación de Access de TEST, no el de producción: son
# aplicaciones distintas y tienen tags distintos. Si este valor estuviera mal,
# el panel denegaría incluso a quien Access ya ha dejado pasar — es la defensa
# en profundidad del §9 haciendo su trabajo, no un error de configuración.
ACCESS_TEAM_DOMAIN = "fullmantis.cloudflareaccess.com"
ACCESS_AUD         = "fdba9bb1d07c7c74acc94241647a1357215f1141e762986770726cf8a9e2bf2b"
CODIGO_MINUTOS   = "10"
CODIGO_INTENTOS  = "5"
CODIGOS_POR_HORA = "3"
MAX_CORREOS_DIA  = "400"
EMAIL_REMITENTE  = "votacion@laorden.org"

# ── Entorno del voto por correo: test-correo.laorden.org ─────────────────────
#
#   ./scripts/desplegar-correo.sh
#
# Existe para poder enseñar LOS DOS sistemas a la vez y compararlos en móviles
# de verdad (spec 2026-09-22 §12.1). Worker aparte, base aparte, aplicación de
# Access aparte, secretos aparte: ninguno de los dos puede tocar los votos del
# otro.
#
# Coste: cero. Las bases D1, los entornos de Worker y los dominios propios
# sobre una zona que ya está en Cloudflare son gratis; lo único que se paga es
# el upgrade a Workers Paid de 5 $, que cubre la cuenta entera.
#
# Igual que arriba: las vars y los bindings NO se heredan. Todo repetido.
[env.correo]
routes = [{ pattern = "test-correo.laorden.org", custom_domain = true }]

[env.correo.assets]
directory = ".."
binding = "ASSETS"

[[env.correo.d1_databases]]
binding = "DB"
database_name = "laorden-votos-correo"
database_id = "282eb59b-f2da-47e6-a3bc-1fc304fee017"
migrations_dir = "migrations"

[[env.correo.send_email]]
name = "EMAIL"

[env.correo.vars]
# Votación FORZADA ABIERTA, igual que en test: es el motivo de que exista.
VOTING_OPEN  = "2026-01-01T00:00:00+01:00"
VOTING_CLOSE = "2027-01-01T00:00:00+01:00"
MINI_COUNT   = "37"
CORS_ORIGIN  = ""
# El AUD es el de la aplicación de Access de test-correo.laorden.org: es una
# aplicación distinta de la de test y tiene un tag distinto.
ACCESS_TEAM_DOMAIN = "fullmantis.cloudflareaccess.com"
ACCESS_AUD         = "f15a64de9757fa9216c64e4b7035cf4f9867914e520186771da44196d2b27189"
CODIGO_MINUTOS   = "10"
CODIGO_INTENTOS  = "5"
CODIGOS_POR_HORA = "3"
MAX_CORREOS_DIA  = "400"
EMAIL_REMITENTE  = "votacion@laorden.org"
