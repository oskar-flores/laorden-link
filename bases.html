<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bases · La Orden</title>
    <meta name="description" content="Bases oficiales de los concursos y torneos de La Orden Asociación Lúdica, Portugalete.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Karla:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!--
        ============================================================
        RENDERIZADOR DE BASES — no hace falta tocar este archivo
        ============================================================

        Para publicar unas bases nuevas:

          1. Crea el Markdown en  bases/<nombre>.md
          2. (Opcional) Sube el PDF a  bases/<nombre>.pdf
          3. Enlázalo desde el evento en index.html:
                 { label: "Ver las bases", url: "bases.html?doc=<nombre>" }

        Cada .md empieza con una cabecera de tres líneas:

          ---
          title: Título del documento
          subtitle: Línea secundaria (opcional)
          pdf: bases/<nombre>.pdf   (opcional, muestra el botón de descarga)
          ---

        El resto es Markdown normal: ##, listas, **negrita**, tablas, enlaces.
        ============================================================
    -->
    <style>
        :root {
            --bg-deep: #0D0906;
            --bg-warm: #1A1008;
            --bg-panel: rgba(255,255,255,0.03);
            --copper: #C47832;
            --copper-light: #D4924A;
            --text-light: #F0E6D6;
            --text-muted: #8A7560;
            --border-subtle: rgba(196,120,50,0.12);
            --border-accent: rgba(196,120,50,0.25);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Karla', sans-serif;
            background: var(--bg-deep);
            color: var(--text-light);
            line-height: 1.7;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        h1, h2, h3 {
            font-family: 'Young Serif', serif;
            font-weight: 400;
        }

        a {
            color: var(--copper-light);
            text-decoration: none;
            transition: color 0.3s;
        }
        a:hover { color: var(--copper); }

        .container { max-width: 780px; margin: 0 auto; padding: 0 24px; }

        /* --- NAV --- */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 100;
            background: rgba(13,9,6,0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-subtle);
            padding: 14px 0;
        }
        .nav-inner {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .nav-brand img {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1.5px solid var(--copper);
            object-fit: cover;
        }
        .nav-brand span {
            font-family: 'Young Serif', serif;
            color: var(--copper);
            font-size: 1.15rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .nav-back {
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--text-muted);
            white-space: nowrap;
        }
        .nav-back:hover { color: var(--copper); }

        /* --- HEADER --- */
        .doc-header {
            margin-top: 70px;
            padding: 64px 0 48px;
            background: linear-gradient(180deg, var(--bg-warm) 0%, var(--bg-deep) 100%);
            border-bottom: 1px solid var(--border-subtle);
        }
        .doc-label {
            color: var(--copper);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 14px;
        }
        .doc-header h1 {
            font-size: clamp(1.9rem, 4.5vw, 2.8rem);
            line-height: 1.15;
            margin-bottom: 12px;
        }
        .doc-subtitle {
            color: var(--text-muted);
            font-size: 1rem;
        }
        .doc-actions { margin-top: 2rem; }
        .btn-ghost {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: transparent;
            border: 1px solid var(--border-accent);
            color: var(--copper-light);
            padding: 10px 24px;
            border-radius: 5px;
            font-weight: 600;
            font-size: 0.82rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s;
        }
        .btn-ghost:hover {
            background: var(--copper);
            border-color: var(--copper);
            color: var(--bg-deep);
        }
        .btn-ghost svg { width: 16px; height: 16px; }

        /* --- MARKDOWN BODY --- */
        .doc-body { padding: 48px 0 72px; }
        .doc-body h2 {
            font-size: 1.35rem;
            color: var(--text-light);
            margin: 44px 0 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-subtle);
        }
        .doc-body h2:first-child { margin-top: 0; }
        .doc-body h3 {
            font-size: 1.1rem;
            color: var(--copper);
            margin: 28px 0 12px;
        }
        .doc-body p {
            color: var(--text-muted);
            margin-bottom: 14px;
        }
        .doc-body strong { color: var(--text-light); font-weight: 600; }
        .doc-body ul, .doc-body ol {
            list-style: none;
            color: var(--text-muted);
            margin-bottom: 14px;
        }
        .doc-body li {
            position: relative;
            padding-left: 22px;
            margin-bottom: 10px;
        }
        .doc-body li::before {
            content: '';
            position: absolute;
            left: 2px;
            top: 0.75em;
            width: 6px;
            height: 6px;
            background: var(--copper);
            border-radius: 50%;
            opacity: 0.6;
        }
        .doc-body li ul { margin-top: 10px; margin-bottom: 0; }
        .doc-body li ul li::before {
            background: transparent;
            border: 1px solid var(--copper);
            opacity: 0.5;
        }
        .doc-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 4px 0 20px;
            font-size: 0.92rem;
        }
        .doc-body th {
            text-align: left;
            color: var(--copper);
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 8px 16px 8px 0;
            border-bottom: 1px solid var(--border-accent);
        }
        /* Tabla sin cabecera: en Markdown se escribe como "| | |" */
        .doc-body thead:has(th:empty) { display: none; }
        .doc-body td {
            color: var(--text-muted);
            padding: 10px 16px 10px 0;
            border-top: 1px solid var(--border-subtle);
            vertical-align: top;
        }
        .doc-body td:first-child {
            width: 33%;
            color: var(--text-light);
        }
        .doc-body td strong {
            color: var(--copper);
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .doc-body blockquote {
            border-left: 2px solid var(--border-accent);
            padding-left: 20px;
            margin: 0 0 16px;
            color: var(--text-muted);
            font-style: italic;
        }
        .doc-body hr {
            border: 0;
            border-top: 1px solid var(--border-subtle);
            margin: 36px 0;
        }
        .doc-note {
            color: var(--text-muted);
            padding: 24px;
            background: var(--bg-panel);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
        }

        /* --- FOOTER --- */
        footer {
            margin-top: auto;
            padding: 28px 0;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.8rem;
            border-top: 1px solid var(--border-subtle);
            letter-spacing: 1px;
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 768px) {
            .doc-header { padding: 44px 0 36px; }
            .nav-brand span { display: none; }
            .doc-body table, .doc-body td, .doc-body th { display: block; width: auto; }
            .doc-body th { padding-bottom: 4px; }
            .doc-body td { border-top: 0; padding: 0 0 4px; }
            .doc-body td strong { letter-spacing: 1px; }
            .doc-body tr { display: block; padding: 10px 0; border-top: 1px solid var(--border-subtle); }
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-inner">
            <a href="index.html" class="nav-brand">
                <img src="logo.jpg" alt="Logo La Orden">
                <span>La Orden</span>
            </a>
            <a href="index.html#eventos" class="nav-back">&larr; Volver a eventos</a>
        </div>
    </nav>

    <header class="doc-header">
        <div class="container">
            <div class="doc-label">Bases Oficiales</div>
            <h1 id="doc-title">Bases</h1>
            <p class="doc-subtitle" id="doc-subtitle">La Orden Asociación Lúdica &middot; Portugalete, Bizkaia</p>
            <div class="doc-actions" id="doc-actions"></div>
        </div>
    </header>

    <main class="doc-body">
        <div class="container">
            <noscript>
                <div class="doc-note">
                    Estas bases se muestran con JavaScript. Si no puedes verlas, descarga el PDF
                    desde <a href="bases/">bases/</a> o escríbenos a
                    <a href="mailto:laordenaslu@gmail.com">laordenaslu@gmail.com</a> y te las enviamos.
                </div>
            </noscript>
            <div id="doc-content"></div>
        </div>
    </main>

    <footer>
        <div class="container">
            La Orden &copy; 2025 &middot; Asociación Lúdica
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/marked@18.0.9/lib/marked.umd.js"
            integrity="sha384-kyb7rY2xnKgiRpRdAeNJxQ8e2SiGZy1m+FK9yME6M0eGJpg7EFaGGvf7+JSirgqE"
            crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script>
        (function() {
            var content  = document.getElementById('doc-content');
            var titleEl  = document.getElementById('doc-title');
            var subEl    = document.getElementById('doc-subtitle');
            var actions  = document.getElementById('doc-actions');

            function fail(msg) {
                content.innerHTML = '<div class="doc-note">' + msg
                    + ' Escríbenos a <a href="mailto:laordenaslu@gmail.com">laordenaslu@gmail.com</a>'
                    + ' y te las enviamos.</div>';
            }

            // ?doc=concurso-pintura  ->  bases/concurso-pintura.md
            // Solo letras, números y guiones: el documento siempre sale de bases/
            var doc = (new URLSearchParams(location.search).get('doc') || '').toLowerCase();
            if (!/^[a-z0-9][a-z0-9-]*$/.test(doc)) {
                fail('No se ha indicado qué bases mostrar.');
                return;
            }

            // Cabecera --- title / subtitle / pdf --- al principio del .md
            function splitFrontMatter(md) {
                var meta = {};
                var m = /^---\r?\n([\s\S]*?)\r?\n---\r?\n?/.exec(md);
                if (!m) return { meta: meta, body: md };
                m[1].split(/\r?\n/).forEach(function(line) {
                    var i = line.indexOf(':');
                    if (i > 0) meta[line.slice(0, i).trim()] = line.slice(i + 1).trim();
                });
                return { meta: meta, body: md.slice(m[0].length) };
            }

            fetch('bases/' + doc + '.md')
                .then(function(res) {
                    if (!res.ok) throw new Error(res.status);
                    return res.text();
                })
                .then(function(md) {
                    var parsed = splitFrontMatter(md);
                    var meta = parsed.meta;

                    if (meta.title) {
                        titleEl.textContent = meta.title;
                        document.title = meta.title + ' · Bases · La Orden';
                    }
                    if (meta.subtitle) subEl.textContent = meta.subtitle;
                    if (meta.pdf) {
                        actions.innerHTML = '<a href="' + encodeURI(meta.pdf) + '" class="btn-ghost"'
                            + ' target="_blank" rel="noopener">'
                            + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">'
                            + '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>'
                            + 'Descargar PDF</a>';
                    }

                    // El Markdown lo escribe la propia organización (está en el repo),
                    // así que se renderiza tal cual.
                    content.innerHTML = marked.parse(parsed.body);
                })
                .catch(function() {
                    fail('No hemos podido cargar estas bases.');
                });
        })();
    </script>

</body>
</html>
